  # - label: "ServiceNow"
  #   app_id: "REPLACE_ME"
  #   sign_on_mode: "SAML_2_0"
  #   migration_status: "pending"
  #   notes: "Custom attribute statements used; claims mapping must be validated"

  # - label: "Internal HR Portal (SWA)"
  #   app_id: "REPLACE_ME"
  #   sign_on_mode: "AUTO_LOGIN"
  #   migration_status: "blocked"
  #   notes: "SWA app — no SAML/OIDC support; will remain in Okta post-migration"

# -----------------------------------------------------------------------------
# Migration Status — Tracks the overall Okta → Entra migration
# -----------------------------------------------------------------------------
# Only relevant when operating_mode is "migrating" or "coexistence".
# Skip or comment out if Okta remains the permanent IdP.
migration_status:

  # Current phase of the migration
  # discovery    — inventorying Okta objects; no changes made yet
  # prep         — creating Entra objects (groups, extension schemas, app registrations)
  # coexistence  — Okta and Entra both active; apps being migrated one by one
  # cutover      — final cutover; Okta being decommissioned
  # completed    — Okta decommissioned; Entra is sole IdP
  phase: "discovery"  # discovery | prep | coexistence | cutover | completed

  # Target cutover date (ISO 8601)
  # cutover_target: "REPLACE_ME (e.g., 2026-10-01)"

  # Migration tracking notes
  notes: "REPLACE_ME — e.g., Phase 1: user inventory completed. Phase 2: group recreation in progress."

  # Apps NOT being migrated (staying in Okta or being retired separately)
  # apps_excluded_from_migration:
  #   - label: "Legacy SWA App"
  #     reason: "No SAML/OIDC support; vendor contract ends 2027-Q1"

# -----------------------------------------------------------------------------
# Security Notes — Okta-specific operational security context
# -----------------------------------------------------------------------------
security:

  # Whether Okta MFA is enforced for admin console access
  admin_mfa_enforced: true  # true | false | REPLACE_ME

  # Whether Okta ThreatInsight (risk-based blocking) is enabled
  threat_insight_enabled: true  # true | false | REPLACE_ME

  # Whether Okta's System Log is forwarded to Sentinel
  system_log_to_sentinel: false  # true | false | REPLACE_ME
  # If true, note the connector/data source name:
  # sentinel_table: "OktaSSO_CL"  # or "Okta_CL" depending on connector version

  notes: "REPLACE_ME — e.g., SSWS token rotation last performed 2026-01-15; schedule next rotation"
