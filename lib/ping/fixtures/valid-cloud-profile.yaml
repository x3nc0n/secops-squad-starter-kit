migration_profile:
  source_of_truth:
    identity_authority: pingone
    federation_source: pingone
    hris_system: null
    per_class_ownership:
      users: ping
      credentials_mfa: ping
      groups: ping
      app_assignments: ping
      policies: ping
      saml_sp_connections: ping
    per_attribute_authority: []
  strategy:
    cutover_shape: big_bang
    group_strategy: lift_and_shift
    federation_direction: ping_idp_into_entra
    mfa_strategy: passkey_bootstrap
    nameid_strategy: use_email
  execution:
    dry_run: true
    entra_write_tooling: none
